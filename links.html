<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionHub — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c12;
    --bg-glow: #171123;
    --panel: #12151f;
    --line: #232838;
    --text: #e9e8f2;
    --muted: #8990a8;
    --accent: #8b6bff;
    --accent-2: #43e6c8;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, var(--bg-glow), var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 18px;
    transition: color 0.2s ease;
  }

  .back:hover { color: var(--text); }

  .avatar-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
  }

  .ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    animation: spin 5s linear infinite;
  }

  .ring::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--bg);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    object-fit: cover;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
  }

  .status-pill {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--accent-2);
    color: var(--accent-2);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }

  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .links {
    display: grid;
    gap: 10px;
  }

  .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .link-row:hover {
    border-color: var(--accent);
    transform: translateX(2px);
  }

  .link-row:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .link-title {
    font-size: 14.5px;
    font-weight: 600;
  }

  .link-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .arrow {
    color: var(--accent-2);
    font-size: 15px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div class="card">
    <a class="back" href="index.html">← Back</a>

    <div class="avatar-wrap">
      <div class="ring"></div>
      <img class="avatar" src="profile.png" alt="LionguyVR profile picture">
      <div class="status-pill">Verified</div>
    </div>

    <h1>You're in</h1>
    <p class="tagline">Here's everything, updated as it drops.</p>

    <div class="links">
      <a class="link-row" href="https://github.com/QuestCraftPlusPlus/QuestCraft/releases" target="_blank" rel="noopener">
        <span class="link-text">
          <span class="link-title">QuestCraft</span>
          <span class="link-sub">Latest release on GitHub</span>
        </span>
        <span class="arrow">→</span>
      </a>
      <a class="link-row" href="page1.html">
        <span class="link-text">
          <span class="link-title">Test Page</span>
          <span class="link-sub">Internal test link</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

</body>
</html>
