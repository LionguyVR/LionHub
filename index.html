<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c12;
    --bg-glow: #171123;
    --panel: #12151f;
    --line: #232838;
    --text: #e9e8f2;
    --muted: #8990a8;
    --accent: #8b6bff;
    --accent-2: #43e6c8;
    --locked: #545b72;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, var(--bg-glow), var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
  }

  /* --- Avatar + ring signature --- */
  .avatar-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 0 auto 22px;
  }

  .ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--locked), var(--locked));
    transition: background 0.6s ease;
  }

  .ring::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--bg);
  }

  .avatar {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    object-fit: cover;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    filter: grayscale(0.6) brightness(0.85);
  }

  .status-pill {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--locked);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }

  /* --- Header text --- */
  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  /* --- Gate step --- */
  .gate {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .gate-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--line);
    color: var(--text);
    font-size: 11px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease, opacity 0.2s ease;
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0c12;
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(139,107,255,0.6); }

  .btn-verify {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .btn-verify[aria-disabled="true"] {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-verify.armed {
    color: var(--text);
    border-color: var(--accent-2);
  }

  .btn-verify.armed:hover {
    background: rgba(67, 230, 200, 0.08);
  }

  .hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--locked);
    margin: 10px 0 0;
    transition: color 0.3s ease;
  }

  .hint.ok { color: var(--accent-2); }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrap">
      <div class="ring"></div>
      <img class="avatar" src="profile.png" alt="LionguyVR profile picture">
      <div class="status-pill">Locked</div>
    </div>

    <h1>LionguyVR</h1>
    <p class="tagline">VR mods, tools, and downloads.<br>Unlock the list below to get started.</p>

    <div class="gate">
      <div class="gate-label"><span class="step-num">1</span> Subscribe on YouTube</div>
      <a class="btn btn-primary" href="https://youtube.com/@LionguyVR?sub_confirmation=1" target="_blank" rel="noopener" onclick="enableVerify()">
        Subscribe on YouTube
      </a>
    </div>

    <div class="gate">
      <div class="gate-label"><span class="step-num">2</span> Check verification</div>
      <a class="btn btn-verify" id="verifyBtn" href="links.html" aria-disabled="true">Check Verification</a>
      <p class="hint" id="hintText">Complete step 1 first</p>
    </div>
  </div>

  <script>
    function enableVerify() {
      const btn = document.getElementById('verifyBtn');
      const hint = document.getElementById('hintText');
      btn.removeAttribute('aria-disabled');
      btn.classList.add('armed');
      hint.textContent = "You'll be taken to the links page";
      hint.classList.add('ok');
    }
  </script>

</body>
</html>
